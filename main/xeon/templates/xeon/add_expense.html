{% extends 'xeon/base.html' %}

{% block content %}
<div class="container mt-5">

    <h2>Add Expense</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="number" name="amount" class="form-control mb-2" placeholder="Amount">

        <select name="category" class="form-control mb-2">
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>

        <select name="payment_method" class="form-control mb-2">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
            <option value="card">Card</option>
        </select>

        <div class="d-flex justify-content-between">
            <label>Category</label>
            <a href="/category/add/" style="font-size: 12px;">+ Add</a>
        </div>

        <select name="category" class="form-control mb-2">
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>

        <input type="date" name="date" class="form-control mb-2">

        <button class="btn btn-danger">Save</button>

    </form>

</div>


<div class="form-group">

    <!-- LABEL + ADD BUTTON -->
    <div class="d-flex justify-content-between align-items-center">
        <label>Category</label>
        <a href="{% url 'add_category' %}" class="btn btn-sm btn-primary">
            + Add
        </a>
    </div>

    <!-- DROPDOWN -->
    <select name="category" class="form-control">
        {% for cat in categories %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
    </select>

</div>
{% endblock %}
