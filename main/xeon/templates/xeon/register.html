{% extends 'xeon/base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="card p-4 shadow-lg" style="width: 450px; border-radius: 15px;">
        
        <h3 class="text-center mb-3">Create Account 🚀</h3>
        <p class="text-center text-muted">Start managing your finance</p>

        {% if messages %}
        <div class="alert alert-info">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>First Name</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>

                <div class="form-group col-md-6">
                    <label>Last Name</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success btn-block mt-3">Register</button>
        </form>

        <p class="text-center mt-3">
            Already have an account? <a href="/login/">Login</a>
        </p>

    </div>

</div>
{% endblock %}
