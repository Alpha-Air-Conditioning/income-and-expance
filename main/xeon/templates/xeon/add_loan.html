{% extends 'xeon/base.html' %}

{% block content %}
<div class="container mt-5">

    <h2>Add Loan</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="person_name" class="form-control mb-2" placeholder="Person Name" required>

        <select name="loan_type" class="form-control mb-2">
            <option value="borrowed">Borrowed</option>
            <option value="lent">Lent</option>
        </select>

        <input type="number" name="total_amount" class="form-control mb-2" placeholder="Total Amount" required>

        <input type="number" name="paid_amount" class="form-control mb-2" placeholder="Paid Amount">

        <input type="date" name="due_date" class="form-control mb-2">

        <textarea name="note" class="form-control mb-2" placeholder="Note"></textarea>

        <button class="btn btn-warning">Save</button>

    </form>

</div>
{% endblock %}
